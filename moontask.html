<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background-color: black;
            width: 2500px;
        }
        div{
            display: inline-block;
        }
       
        #one{
            height: 200px;
            width: 200px;
            background-color: black;
            border-radius: 50%;
            box-shadow: 20px 0px 5px 5px white;
            margin-top: 100px;
            margin-left: 100px;
        }
        #two{
            height: 200px;
            width: 200px;
            background-color: black;
            border-radius: 50%;
            box-shadow: 70px 0px 10px 5px white;
            margin-top: 100px;
            margin-left: 100px;

        }
        #three{
            height: 200px;
            width: 200px;
            background-color: black;
            border-radius: 50%;
            box-shadow: 110px 0px 5px 5px white;
            margin-top: 100px;
            margin-left: 100px;

        }
        #four{
             height: 200px;
            width: 200px;
            background-color: white;
            border-radius: 50%;
            box-shadow: 0px 0px 5px 5px white;
            margin-top: 100px;
            margin-left: 200px;

        }
        #five{
             height: 200px;
            width: 200px;
            background-color: black;
            border-radius: 50%;
            box-shadow: -110px 0px 5px 5px white;
            margin-top: 100px;
            margin-left: 200px;

        }
        #six{
             height: 200px;
            width: 200px;
            background-color: black;
            border-radius: 50%;
            box-shadow: -70px 0px 10px 5px white;
            margin-top: 100px;
            margin-left: 100px;

        }
        #seven{
             height: 200px;
            width: 200px;
            background-color: black;
            border-radius: 50%;
            box-shadow: -20px 0px 5px 5px white;
            margin-top: 100px;
            margin-left: 100px;
        }
         p{
             display: inline-block;
             color: white;
             font-size: 30px;
            
        }
        #p1{
            margin: 100px;
        }
        #p2{
            margin: 100px;
        }
        #p3{
            margin: 70px;
        }
        #p4{
            margin: 50px;
        }
        #p5{
            margin: 60px;
        }
        #p6{
            margin: 90px;
        }
        #p7{
            margin: 90px;
        }
        h2{
            font-family:monospace;
            color: white;
            font-size: 50px;
            text-align: center;
            color: yellow;
        }

    </style>
</head>
<body>
    <div id="one"></div>
    <div id="two"></div>
    <div id="three"></div>
    <div id="four"></div>
    <div id="five"></div>
    <div id="six"></div>
    <div id="seven"></div>
    <br>
    <p id="p1">Waxing Crescent</p>
    <p id="p2">First Quarter</p>
    <p id="p3">Waxing Gibbous</p>
    <p id="p4">Full Moon</p>
    <p id="p5">Waning Gibbous</p>
    <p id="p6">Third Quarter</p>
    <p id="p7">Waning Crescent</p>
    <h2>MOON PHASES</h2>
</body>
</html>
