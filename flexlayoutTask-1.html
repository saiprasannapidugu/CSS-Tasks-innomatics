<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #box1{
            height: 500px;
            width: 500px;
            background-color: #99C2FF;
            border:5px solid blue;
            border-radius: 50%;
            margin: 50px;
            display: flex;
            flex-direction:row ;
            justify-content: center;
            align-items: center;
        }
        #box2{
            height: 300px;
            width: 300px;
            background-color: pink;
            border: 5px solid red;
            border-radius: 50%;
            z-index:1;
            display: flex;
            flex-direction:row ;
            justify-content: center;
            align-items: center;  
        }
        #box3{
            height:150px;
            width: 150px;
            background-color: lightgreen;
            border: 5px solid green;
            border-radius: 50%;
            z-index: 2;
            color: blue;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 25px;
        }
        p{
            text-align: center;
             text-shadow: 5px 5px 4px;
        }
    </style>
</head>
<body>
        <div id="box1">
        <div id="box2">
        <div id="box3"><p>Fullstack Developer</p></div>
        </div>
        </div>
</body>
</html>
